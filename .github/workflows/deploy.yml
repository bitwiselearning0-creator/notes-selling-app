name: Deploy Bitwise Learning to Bluehost VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build Production Frontend Bundle
        run: pnpm run build

      - name: Deploy Frontend Dist Files to VPS Web Root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 50.6.44.186
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: "/var/www/bitwise-learning"
          strip_components: 1

      - name: Deploy Backend Files to VPS Backend Root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 50.6.44.186
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "server/*"
          target: "/var/www/bitwise-backend"
          strip_components: 1

      - name: Restart PM2 & Nginx Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 50.6.44.186
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/bitwise-backend && npm install --production
            pm2 restart bitwise-api || pm2 start index.js --name bitwise-api
            pm2 save
            systemctl restart nginx
            echo "🎉 GitHub Actions Automatic Deployment Completed!"
